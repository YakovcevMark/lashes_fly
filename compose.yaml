services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: lashes_fly
      POSTGRES_USER: lashes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lashes_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lashes -d lashes_fly']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  lashes_pg: {}
